<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="4;url=index.html">
  <title>Thank You — Berlin Machineries</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Inter:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #C8102E;
      --graphite: #111111;
      --font-display: 'Inter Tight', system-ui, sans-serif;
      --font-sans: 'Inter', system-ui, sans-serif;
    }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      background: var(--graphite);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow: hidden;
      position: relative;
    }
    /* Grid lines bg */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 56px 56px;
      pointer-events: none;
    }
    /* Red glow */
    body::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: rgba(200,16,46,0.12);
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .logo { margin: 0 auto 32px; }
    .logo img { height: 48px; width: auto; object-fit: contain; margin: 0 auto; }
    .check-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(200,16,46,0.15);
      border: 2px solid rgba(200,16,46,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.3em;
      color: var(--red);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      display: inline-block;
      width: 24px; height: 2px;
      background: var(--red);
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(36px, 8vw, 56px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      line-height: 1.7;
      color: rgba(255,255,255,0.6);
      margin-bottom: 32px;
    }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 32px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-wa { background: #25D366; color: #fff; }
    .btn-wa:hover { background: #1db954; transform: translateY(-1px); }
    .btn-call { background: var(--red); color: #fff; }
    .btn-call:hover { background: #a00d24; transform: translateY(-1px); }
    .btn-home { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.15); }
    .btn-home:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .redirect-note {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
    /* Floating buttons */
    .floating-wa {
      position: fixed; left: 20px; bottom: 20px;
      width: 50px; height: 50px; border-radius: 50%;
      background: #25D366;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      transition: transform 0.2s;
      z-index: 90;
    }
    .floating-wa:hover { transform: scale(1.08); }
    .floating-wa img { width: 26px; height: 26px; }
    .floating-call {
      position: fixed; right: 20px; bottom: 20px;
      width: 50px; height: 50px; border-radius: 50%;
      background: var(--red);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(200,16,46,0.3);
      z-index: 90;
      transition: transform 0.2s;
    }
    .floating-call:hover { transform: scale(1.08); }
  </style>
</head>
<body>

    <div class="check-icon">

      </a>
      <a class="btn btn-call" href="tel:+918874157222">

      <a class="btn btn-home" href="index.html">← Back to Home</a>
    </div>
    <div class="redirect-note">Redirecting back in a few seconds…</div>
  </div>

  <a class="floating-wa js-wa-link" href="https://wa.me/918874157222" target="_blank" rel="noopener" aria-label="WhatsApp">
    <img src="assets/whatsapp.svg" alt="">

  <a class="floating-call" href="tel:+918874157222" aria-label="Call">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="white">

    </svg>
  </a>

  <script>
    const waWeb = 'https://web.whatsapp.com/send?phone=918874157222&text=Hello%2C%20I%20just%20submitted%20an%20enquiry%20on%20your%20website.';
    const waApi = 'https://wa.me/918874157222?text=Hello%2C%20I%20just%20submitted%20an%20enquiry%20on%20your%20website.';
    const mobile = window.matchMedia('(max-width:1024px)').matches || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
    document.querySelectorAll('.js-wa-link').forEach(a => { a.href = mobile ? waApi : waWeb; });
    setTimeout(() => { window.location.replace('index.html'); }, 4000);
  </script>
</body>
</html>
